<!DOCTYPE html>
<html>

<head>
    <title>Server Control</title>

    <style>
        body {
            margin: 0;
            background: #0b0c0a;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 1000px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .application {
            background: #151613;
            border: 1px solid #292a26;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 15px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            font-size: 14px;
        }

        .running {
            color: #5cff87;
        }

        .stopped {
            color: #ff5e5e;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .start {
            background: #5cff87;
            color: #071009;
        }

        .stop {
            background: #ff5e5e;
            color: white;
        }

        .restart {
            background: #ff5e1a;
            color: white;
        }

        .port {
            color: #888;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <main>

        <h1>Server Control</h1>

        {% for key, application in applications.items() %}

        <div class="application">

            <div class="top">
                <div>
                    <h2>{{ application.name }}</h2>
                    <div class="port">
                        Port {{ application.port }}
                    </div>
                </div>

                {% if application.running %}
                <div class="status running">● Running</div>
                {% else %}
                <div class="status stopped">● Stopped</div>
                {% endif %}
            </div>

            <div class="buttons">

                {% if not application.running %}
                <form method="POST" action="/control/{{ key }}/start">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button class="start">Start & Update</button>
                </form>
                {% endif %}

                {% if application.running %}
                <form method="POST" action="/control/{{ key }}/stop">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button class="stop">Stop</button>
                </form>
                {% endif %}

                <form method="POST" action="/control/{{ key }}/restart">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button class="restart">Update & Restart</button>
                </form>

            </div>

        </div>

        {% endfor %}

    </main>

</body>

</html>
